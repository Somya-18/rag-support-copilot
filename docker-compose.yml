services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports: ["5432:5432"]
    volumes: ["copilot-postgres:/var/lib/postgresql/data"]
  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: .
    env_file: .env
    command: ["uvicorn", "kube_copilot.api:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["8000:8000"]
    volumes: ["./corpus.lock.json:/app/corpus.lock.json"]
  worker:
    build: .
    env_file: .env
    command: ["kube-copilot", "worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes: ["./corpus.lock.json:/app/corpus.lock.json"]
volumes:
  copilot-postgres:
